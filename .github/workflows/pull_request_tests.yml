name: Unit tests
on:
  push:
    branches:
      - test

jobs:
  test-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Build media"
        run: |
            cp .env-dist .env
            npm ci
            npm run build
      - name: "Run collectstatic"
        run: |
            DEV=False WAGTAIL_ENABLE_ADMIN=False docker compose run app python manage.py collectstatic --noinput
