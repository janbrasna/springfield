name: Unit tests
on:
  push:
    branches:
      - test

jobs:
  test-combo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: "Run Python tests (via test-ci)"
        run: |
            make test-ci
      - name: "Run static collection (via release)"
        run: |
            docker compose run release python manage.py collectstatic --noinput
